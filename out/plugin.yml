name: CoinCash
version: 1.0.2
main: com.foxsrv.coincash.CoinCash
api-version: 1.20
depend: [CoinCard]
softdepend: [Vault]
author: FoxSRV
description: Cash system for CoinCard plugin - Withdraw and deposit coins as physical notes

commands:
  cash:
    description: Main CoinCash command
    usage: /cash
    aliases: [coincash, ccash]
    permission: coincash.use

permissions:
  coincash.use:
    description: Allows using /cash command
    default: true
  coincash.admin:
    description: Allows admin commands
    default: op
